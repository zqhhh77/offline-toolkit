name: Build Nginx 1.31.10 for Kylin V10 (x86_64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROCKY_IMAGE: rockylinux:8
      PACKAGE: nginx-1.31.10-kylin-v10-halberd-x86_64
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare build image
        run: |
          docker pull --platform linux/amd64 "$ROCKY_IMAGE"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$ROCKY_IMAGE")
          printf 'BUILD_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          docker run --rm --pull never --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            --mount "type=bind,source=$PWD/dist,target=/out" \
            -e BUILD_COMMIT -e BUILD_IMAGE \
            "$BUILD_IMAGE" bash /src/scripts/nginx/build-kylin-v10.sh /out

      - name: Verify archive and test with networking disabled
        run: |
          (cd dist && sha256sum --check --strict "$PACKAGE.tar.gz.sha256")
          extracted=$(mktemp -d)
          trap 'rm -rf -- "$extracted"' EXIT
          tar --no-same-owner -xzf "dist/$PACKAGE.tar.gz" -C "$extracted"
          docker run --rm --pull never --platform linux/amd64 --network none \
            --user 10000:10000 --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /work:rw,exec,nosuid,nodev,mode=1777 \
            --tmpfs /usr/local:rw,exec,nosuid,nodev,mode=1777 \
            --mount "type=bind,source=$extracted/$PACKAGE,target=/package,readonly" \
            --mount "type=bind,source=$PWD/scripts/nginx/smoke-kylin-v10.sh,target=/smoke.sh,readonly" \
            "$BUILD_IMAGE" bash /smoke.sh /package

      - name: Upload offline package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nginx-1.31.10-kylin-v10-halberd-x86_64
          if-no-files-found: error
          path: |
            dist/nginx-1.31.10-kylin-v10-halberd-x86_64.tar.gz
            dist/nginx-1.31.10-kylin-v10-halberd-x86_64.tar.gz.sha256
